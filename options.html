<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>一键直达 - 设置</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 640px; margin: 30px auto; padding: 0 20px; background: #f6f7fb; color: #333; }
  h1 { font-size: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .link-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .link-row input { flex: 1; padding: 7px 10px; border: 1px solid #d8dce6; border-radius: 6px; font-size: 13px; }
  .link-row .icon-input { flex: 0 0 60px; text-align: center; }
  .link-row button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn-del { background: #fee2e2; color: #b91c1c; }
  .btn-up { background: #e0e7ff; color: #3730a3; }
  .btn-add { background: #3b82f6; color: #fff; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .btn-save { background: #16a34a; color: #fff; padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; }
  .tip { font-size: 12px; color: #888; margin-top: 6px; }
  .default-mark { font-size: 12px; background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .default-mark.active { background: #dcfce7; color: #166534; }
  .saved-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #16a34a; color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .saved-toast.show { opacity: 1; }
  .emoji-picker { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .emoji-picker span { cursor: pointer; font-size: 20px; padding: 4px; border-radius: 6px; }
  .emoji-picker span:hover { background: #eef2ff; }
  .small { font-size: 12px; color: #666; }
</style>
</head>
<body>
  <h1>⚡ 一键直达 Launcher 设置</h1>

  <div class="card">
    <h2>📌 单击图标打开的默认链接</h2>
    <p class="small">点下方链接右侧的「设为默认」，然后点图标一下就直接打开它。</p>
  </div>

  <div class="card">
    <h2>🔗 链接列表（右键图标也能选）</h2>
    <div id="linkList"></div>
    <button class="btn-add" onclick="addRow()">＋ 添加链接</button>
  </div>

  <div class="card">
    <h2>😀 可选图标（Emoji）</h2>
    <div class="emoji-picker" id="emojiPicker"></div>
    <p class="tip">点击 Emoji 会填入当前编辑行的图标框。也可以手动输入任意 Emoji 或文字。</p>
  </div>

  <button class="btn-save" onclick="save()">💾 保存设置</button>

  <div class="saved-toast" id="toast">已保存 ✓</div>

<script>
  const EMOJIS = ["🤖","📝","💼","🌐","🔍","⚽","📰","🎬","🎵","🛒","💰","📊","🏠","☁️","📧","🗂️","📅","🧭","🔧","⭐"];
  const DEFAULT_LINKS = [
    { id: "ds", name: "DeepSeek Harness", url: "http://127.0.0.1:3080/", icon: "🤖" },
    { id: "gzh", name: "公众号后台", url: "https://mp.weixin.qq.com/", icon: "📝" },
    { id: "feishu", name: "飞书", url: "https://www.feishu.cn/", icon: "💼" }
  ];

  let links = [];
  let settings = { defaultLinkId: "ds" };
  let editingId = null; // 当前正在编辑图标的行

  async function load() {
    const data = await chrome.storage.local.get(["links", "settings"]);
    links = data.links || DEFAULT_LINKS;
    settings = { defaultLinkId: "ds", ...(data.settings || {}) };
    render();
  }

  function render() {
    const list = document.getElementById("linkList");
    list.innerHTML = "";
    links.forEach((link, idx) => {
      const row = document.createElement("div");
      row.className = "link-row";
      row.innerHTML = `
        <input class="icon-input" value="${escapeHtml(link.icon)}" data-idx="${idx}" data-field="icon" placeholder="图标">
        <input value="${escapeHtml(link.name)}" data-idx="${idx}" data-field="name" placeholder="名称">
        <input value="${escapeHtml(link.url)}" data-idx="${idx}" data-field="url" placeholder="https://...">
        <span class="default-mark ${settings.defaultLinkId === link.id ? 'active' : ''}" onclick="setDefault('${link.id}')">${settings.defaultLinkId === link.id ? '✓ 默认' : '设默认'}</span>
        <button class="btn-up" onclick="moveRow(${idx}, -1)">↑</button>
        <button class="btn-up" onclick="moveRow(${idx}, 1)">↓</button>
        <button class="btn-del" onclick="delRow(${idx})">✕</button>
      `;
      list.appendChild(row);
    });

    // Emoji 选择器
    const picker = document.getElementById("emojiPicker");
    picker.innerHTML = "";
    EMOJIS.forEach(e => {
      const span = document.createElement("span");
      span.textContent = e;
      span.title = "填入图标";
      span.onclick = () => {
        const input = document.querySelector(`.icon-input[data-idx="${editingId ?? 0}"]`);
        if (input) { input.value = e; editingId = null; }
      };
      picker.appendChild(span);
    });

    // 点击图标框时记录正在编辑的行
    document.querySelectorAll('.icon-input').forEach(input => {
      input.onfocus = () => { editingId = parseInt(input.dataset.idx); };
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function addRow() {
    links.push({ id: "l" + Date.now(), name: "新链接", url: "https://", icon: "🔗" });
    render();
    // 聚焦新行的名称输入框
    const rows = document.querySelectorAll('.link-row');
    const last = rows[rows.length - 1];
    if (last) last.querySelector('input[data-field="name"]').focus();
  }

  function delRow(idx) {
    const id = links[idx].id;
    links.splice(idx, 1);
    if (settings.defaultLinkId === id) settings.defaultLinkId = links[0]?.id || "";
    render();
  }

  function moveRow(idx, dir) {
    const target = idx + dir;
    if (target < 0 || target >= links.length) return;
    [links[idx], links[target]] = [links[target], links[idx]];
    render();
  }

  function setDefault(id) {
    settings.defaultLinkId = id;
    render();
  }

  // 输入变化实时写入
  document.addEventListener('input', (e) => {
    const input = e.target.closest('input[data-idx]');
    if (!input) return;
    const idx = parseInt(input.dataset.idx);
    const field = input.dataset.field;
    if (links[idx]) links[idx][field] = input.value;
  });

  async function save() {
    await chrome.storage.local.set({ links, settings });
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1500);
  }

  load();
</script>
</body>
</html>
